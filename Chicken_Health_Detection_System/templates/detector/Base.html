{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Poultry Watch{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'detector/css/style.css' %}">
</head>
<body>
<header class="site-header">
    <a class="wordmark" href="{% url 'home' %}">Poultry Watch</a>
    <nav>
        <a href="{% url 'upload_image' %}">Image</a>
        <a href="{% url 'upload_video' %}">Video</a>
        <a href="{% url 'live_stream_page' %}">Live camera</a>
    </nav>
</header>

<main>
    {% block content %}{% endblock %}
</main>

<footer class="site-footer">
    <p>Broiler chicken health detection, powered by a fine-tuned YOLOv8 model.</p>
</footer>
</body>
</html>
